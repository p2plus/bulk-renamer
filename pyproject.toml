[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-renamer"
version = "1.0.0"
description = "Safe bulk file renamer with live preview and one-click undo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "bulk-renamer contributors" }]
keywords = ["rename", "bulk", "files", "undo", "batch"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
bulk-renamer = "bulk_renamer.cli:main"
bulk-renamer-gui = "bulk_renamer.webgui:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bulk_renamer = ["static/*"]
